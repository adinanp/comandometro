<!doctype html>
<html lang="pt-br" class="h-full bg-[#FAFAFA]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comandometro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonte Inter (Estilo Cal.com) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="h-full flex flex-col font-sans antialiased text-gray-900 bg-[#FAFAFA]"
  >
    <!-- Navbar Cal.com Style -->
    <header class="border-b border-gray-200 bg-white sticky top-0 z-50">
      <div
        class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-8 h-8 rounded-lg bg-black text-white flex items-center justify-center font-bold text-sm"
          >
            C
          </div>
          <span class="text-base font-semibold text-gray-900"
            >Comandometro</span
          >
          <span
            class="text-xs font-medium px-2 py-0.5 rounded-md bg-gray-100 text-gray-600 border border-gray-200"
          >
            v0.1
          </span>
        </div>
        <nav class="flex items-center gap-6 text-sm font-medium text-gray-600">
          <a
            href="{% url 'core:dashboard' %}"
            class="text-gray-900 font-semibold"
            >Dashboard</a
          >
          <a href="{% url 'core:game-list' %}" class="hover:text-gray-900 transition"
            >Partidas</a
          >
          <a href="{% url 'core:player-list' %}" class="hover:text-gray-900 transition"
            >Jogadores</a
          >
        </nav>
      </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
      {% block content %}{% endblock %}
    </main>

    <!-- Preview flutuante de carta, usado por qualquer elemento com data-card-image.
         Opacidade/escala são controladas via style inline (não classes Tailwind
         dinâmicas) para não depender do timing do compilador JIT do CDN do Tailwind
         gerando CSS pra classes que só existem depois de um toggle via JS. -->
    <div
      id="card-hover-preview"
      class="fixed z-50 pointer-events-none transition duration-150 ease-out"
      style="left: -9999px; top: -9999px; opacity: 0; transform: scale(0.95);"
    >
      <img class="w-56 h-auto rounded-lg shadow-2xl border border-gray-200" alt="" />
    </div>
    <script>
      (function () {
        var preview = document.getElementById("card-hover-preview");
        var img = preview.querySelector("img");
        var PREVIEW_WIDTH = 224;
        var PREVIEW_HEIGHT_ESTIMATE = 312;

        function positionNear(target) {
          var rect = target.getBoundingClientRect();
          var left = rect.right + 12;
          if (left + PREVIEW_WIDTH + 12 > window.innerWidth) {
            left = rect.left - PREVIEW_WIDTH - 12;
          }
          var top = Math.min(rect.top, window.innerHeight - PREVIEW_HEIGHT_ESTIMATE);
          preview.style.left = Math.max(8, left) + "px";
          preview.style.top = Math.max(8, top) + "px";
        }

        document.addEventListener("mouseover", function (event) {
          var target = event.target.closest("[data-card-image]");
          if (!target) return;
          var url = target.getAttribute("data-card-image");
          if (!url) return;
          img.src = url;
          positionNear(target);
          preview.style.opacity = "1";
          preview.style.transform = "scale(1)";
        });

        document.addEventListener("mouseout", function (event) {
          var target = event.target.closest("[data-card-image]");
          if (!target) return;
          if (target.contains(event.relatedTarget)) return;
          preview.style.opacity = "0";
          preview.style.transform = "scale(0.95)";
        });
      })();
    </script>
  </body>
</html>
