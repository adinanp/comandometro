{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto text-center space-y-6 py-12">
  <h1 class="text-2xl font-bold text-gray-900">Você foi convidado para o pod</h1>
  <p class="text-3xl font-bold text-gray-900">{{ invited_pod.name }}</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="text-sm font-semibold px-6 py-2.5 rounded-lg bg-black text-white hover:bg-gray-800 transition">
      Entrar no Pod
    </button>
  </form>
</div>
{% endblock %}
