{% extends "base.html" %}

{% block content %}
<div class="max-w-lg mx-auto space-y-6">

  <button type="button" onclick="history.back()" class="text-sm text-gray-500 hover:text-gray-900 transition">
    ← Voltar
  </button>

  <div>
    <h1 class="text-2xl font-bold text-gray-900">Novo Deck</h1>
    <p class="text-sm text-gray-500">Busque o comandante pelo nome. A dupla só aparece se a carta permitir.</p>
  </div>

  <form method="post" class="bg-white border border-gray-200 rounded-xl shadow-sm p-6">
    {% csrf_token %}
    {% include "core/_deck_fields.html" with form=form %}
    <button type="submit" class="mt-4 w-full text-sm font-semibold px-4 py-2 rounded-lg bg-black text-white hover:bg-gray-800 transition">
      Cadastrar
    </button>
  </form>

</div>
{% endblock %}
