{% extends "base.html" %}

{% block content %}
<div class="max-w-lg mx-auto space-y-6">

  <button type="button" onclick="history.back()" class="text-sm text-gray-500 hover:text-gray-900 transition">
    ← Voltar
  </button>

  <div>
    <h1 class="text-2xl font-bold text-gray-900">Novo Jogador</h1>
    <p class="text-sm text-gray-500">Cadastra alguém no roster do pod — não precisa ter conta.</p>
  </div>

  <form method="post" class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 space-y-4">
    {% csrf_token %}
    {% for field in form %}
    <div>
      <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}
      <p class="text-xs text-red-600 mt-1">{{ field.errors|join:", " }}</p>
      {% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="w-full text-sm font-semibold px-4 py-2 rounded-lg bg-black text-white hover:bg-gray-800 transition">
      Cadastrar
    </button>
  </form>

</div>
{% endblock %}
